<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation API Calls</title>
    <style>
        #output {
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
    <script>
        function executeApiCalls() {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "🚀 Starting API calls...\n";

            fetch('/api/finicity/execute')
                .then(response => {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    function readStream() {
                        return reader.read().then(({ done, value }) => {
                            if (done) return;
                            const text = decoder.decode(value);

                            // Split lines properly to avoid buffer merging
                            const lines = text.split("\n").filter(line => line.trim() !== "");

                            lines.forEach(line => {
                                outputDiv.innerHTML += line + "<br>"; // Print each API response line
                            });

                            return readStream();
                        });
                    }
                    return readStream();
                })
                .catch(error => {
                    console.error("Error:", error);
                    outputDiv.innerHTML += `<br>❌ Error: ${error.message}`;
                });
        }
    </script>
</head>
<body>
<h1>Automation API Calls</h1>
<button onclick="executeApiCalls()">Start API Calls</button>
<div id="output"></div>
</body>
</html>

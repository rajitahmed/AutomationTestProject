<div class="api-section">
    <h2 class="section-title">Available API Flows</h2>
    
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="api-card">
                <div class="api-card-title">Open Banking</div>
                <div class="api-card-description">
                    Test the Finicity API flow including authentication, customer creation, connect link generation, and account refresh.
                </div>
                <button class="action-button" onclick="selectApiFlow('finicity')">
                    Select Flow
                </button>
            </div>
        </div>
        
        <div class="col-md-6 mb-3">
            <div class="api-card">
                <div class="api-card-title">BIN Lookup</div>
                <div class="api-card-description">
                    Test the BIN Lookup API to retrieve information about a Bank Identification Number.
                </div>
                <button class="action-button" onclick="selectApiFlow('binlookup')" disabled>
                    Coming Soon
                </button>
            </div>
        </div>
    </div>
</div>
